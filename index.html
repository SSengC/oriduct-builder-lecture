<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>행운의 번호 & AI 동물상 테스트</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  </head>
  <body class="dark-mode">
    <div class="theme-toggle">
      <button id="theme-btn">☀️ 라이트 모드</button>
    </div>

    <div class="nav-menu">
      <button class="nav-btn active" onclick="showView('lotto-view')">🔢 번호 생성기</button>
      <button class="nav-btn" onclick="showView('animal-view')">🐶 동물상 테스트</button>
    </div>

    <div class="container">
      <!-- 번호 생성기 뷰 -->
      <section id="lotto-view">
        <h1>행운의 번호 생성기</h1>
        <div class="game-selector">
          <label for="game-select">게임 선택:</label>
          <select id="game-select">
            <option value="lotto">로또 6/45</option>
            <option value="pension">연금복권 720+</option>
            <option value="spitfire">스피또 2000</option>
            <option value="powerball">파워볼 (가상)</option>
            <option value="random">랜덤 숫자 (1-100)</option>
          </select>
        </div>
        <div id="numbers-display" class="numbers-container"></div>
        <button id="generate-btn">번호 생성하기</button>
      </section>

      <!-- 동물상 테스트 뷰 -->
      <section id="animal-view" style="display: none;">
        <h1>AI 동물상 테스트</h1>
        <p>사진을 업로드하여 나의 동물상을 확인해보세요!</p>
        
        <div class="animal-controls">
          <label for="image-upload" class="upload-label">📁 사진 업로드해서 확인하기</label>
          <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)" style="display: none;">
        </div>

        <div id="image-preview-container">
          <img id="uploaded-image" src="#" alt="미리보기" style="display: none; max-width: 100%; border-radius: 20px; margin: 0 auto 20px;">
        </div>

        <div id="label-container"></div>
        <div id="result-compliment" style="margin-top: 30px; padding: 20px; border-radius: 15px; line-height: 1.6; font-weight: 500; display: none;"></div>
      </section>

      <!-- 하단 공통 섹션 -->
      <div class="contact-section">
        <hr>
        <h3>🤝 제휴 문의</h3>
        <form action="https://formspree.io/f/xwvrjdbq" method="POST" id="contact-form">
          <div class="form-group">
            <input type="text" name="name" placeholder="성함 또는 업체명" required>
          </div>
          <div class="form-group">
            <input type="email" name="email" placeholder="이메일 주소" required>
          </div>
          <div class="form-group">
            <textarea name="message" rows="4" placeholder="문의 내용" required></textarea>
          </div>
          <button type="submit" class="submit-btn">문의 보내기</button>
        </form>
      </div>

      <div class="comments-section">
        <hr>
        <div id="disqus_thread"></div>
        <script>
            (function() { 
            var d = document, s = d.createElement('script');
            s.src = 'https://productbuilder-zoojyjuh4r.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
            })();
        </script>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
